name: VisionOS Build Workflow
on:
  workflow_dispatch:
  #schedule:
  #  - cron: 0 19 * * 5
jobs:
  build:
    name: Build MacOS
    runs-on: macos-latest-xlarge
    outputs:
      buildVersion: ${{ steps.buildStep.outputs.buildVersion }}
    steps:
    
      # checkout
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
           #lfs: 'true'
           #submodules: 'recursive'
           ref: '' # develop
           #token: ${{ secrets.GH_PAT_TOKEN }}

      # Cache
      - name: Caching
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-macos-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-macos

      # Unity build stage
      - name: Build (Unity)
        uses: game-ci/unity-builder@v4
        id: buildStep
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: VisionOS
          unityVersion: ${{ secrets.UNITY_VERSION }}
          versioning: Semantic
          allowDirtyBuild: true
          #buildMethod: BuildCommand.Build
          buildsPath: build/VisionOS
          buildName: SampleVisionPro
          #gitPrivateToken: ${{ secrets.GH_PAT_TOKEN }}
          #customParameters: -customBuildTarget VisionOS -customBuildPath build/ -customBuildName MirageXR 

      # Xcode build stage
      - name: Build (Xcode)
        uses: buildalon/unity-xcode-builder@v1
        id: xcode-build
        with:
          project-path: 'build'
          app-store-connect-key: ${{ secrets.APP_STORE_CONNECT_KEY }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          upload: 'true'
          export-option: 'app-store-connect'
          auto-increment-build-number: 'true'

      # list outputs
      - name: List outputs generated
        run: |
          echo ${{ steps.xcode-build.outputs.executable }}
          ls -al ${{ steps.xcode-build.outputs.output-directory }}
          
      #- uses: actions/upload-artifact@v6
      #  with:
      #    name: iOS-Build
      #    path: ${{ steps.xcode-build.outputs.executable }}

  # Deploy stage
  prerelease-notification:
    name: Prerelease Slack notification
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && !github.event.pull_request
    env:
      SLACK_URL: ${{ secrets.SLACK_URL }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      APP_VERSION: ${{ needs.build.outputs.buildVersion }}
      TARGET_PLATFORM: $RUNNER_OS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Post notification
        run: |
          echo $APP_VERSION
          sudo apt-get update && sudo apt-get -y install curl
          chmod +x ./ci/notify-preview.sh && ./ci/notify-preview.sh
          
